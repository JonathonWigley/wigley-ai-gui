<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src carries wigley-layout: for a layout's JSON imports and
         fetches of its own files.
         wigley-plugin: carries a user plugin's page.js and the files it imports.
         frame-src carries wigley-visual: for the visual frames, and img-src
         for the local images markdown draws on it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' wigley-data: wigley-layout: wigley-plugin:; style-src 'self' 'unsafe-inline' wigley-data: wigley-layout: wigley-plugin:; font-src 'self' data: wigley-layout: wigley-plugin:; img-src 'self' data: wigley-layout: wigley-plugin: wigley-visual:; connect-src 'self' wigley-layout: wigley-plugin: ws://localhost:*; frame-src wigley-visual:"
    />
    <title>Auri</title>
  </head>
  <body>
    <div id="app"></div>
    <ol id="log" hidden></ol>
    <script type="module" src="/src/renderer/renderer.ts"></script>
  </body>
</html>
